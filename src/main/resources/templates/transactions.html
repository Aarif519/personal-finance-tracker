<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FinTrack - Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">FinTrack</span>
    <div class="d-flex">
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a th:href="@{/budgets}" class="btn btn-outline-light btn-sm me-2">Budgets</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow mb-4">
        <div class="card-body">
            <h5 class="mb-3">Add Transaction</h5>
            <form th:action="@{/transactions/add}" method="post" class="row g-2">
                <div class="col-md-3">
                    <select name="categoryId" class="form-select" required>
                        <option th:each="c : ${categories}" th:value="${c.id}"
                                th:text="${c.name + ' (' + c.type + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" step="0.01" min="0.01" name="amount"
                           class="form-control" placeholder="Amount" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="description" class="form-control"
                           placeholder="Description" required>
                </div>
                <div class="col-md-2">
                    <input type="date" name="transactionDate" th:value="${today}"
                           class="form-control" required>
                </div>
                <div class="col-md-2">
                    <input type="time" name="transactionTime" th:value="${nowTime}"
                           class="form-control" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary w-100">Add Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Transactions</h5>
        <form th:action="@{/transactions}" method="get" class="m-0">
            <input type="month" name="month" th:value="${month}"
                   class="form-control" onchange="this.form.submit()">
        </form>
    </div>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Category</th>
            <th>Description</th>
            <th class="text-end">Amount</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(transactions)}">
            <td colspan="6" class="text-center text-muted">No transactions this month</td>
        </tr>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.transactionDate}"></td>
            <td th:text="${t.transactionTime != null ? #temporals.format(t.transactionTime, 'hh:mm a') : '-'}"></td>
            <td th:text="${t.category.name}"></td>
            <td th:text="${t.description}"></td>
            <td class="text-end fw-bold"
                th:classappend="${t.type.name() == 'INCOME'} ? 'text-success' : 'text-danger'"
                th:text="${(t.type.name() == 'INCOME' ? '+ ' : '- ') + t.amount}"></td>
            <td class="text-end">
                <form th:action="@{'/transactions/delete/' + ${t.id}}" method="post" class="m-0">
                    <input type="hidden" name="month" th:value="${month}">
                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
