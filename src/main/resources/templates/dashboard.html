<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FinTrack - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">FinTrack</span>
    <div class="d-flex">
        <a th:href="@{/transactions}" class="btn btn-outline-light btn-sm me-2">Transactions</a>
        <a th:href="@{/budgets}" class="btn btn-outline-light btn-sm me-2">Budgets</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Welcome, <span th:text="${name}">User</span> 👋</h3>

        <form th:action="@{/dashboard}" method="get" class="m-0">
            <input type="month" name="month" th:value="${month}"
                   class="form-control" onchange="this.form.submit()">
        </form>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-success shadow">
                <div class="card-body">
                    <h6>Total Income</h6>
                    <h3>₹ <span th:text="${#numbers.formatDecimal(summary.totalIncome, 1, 'COMMA', 2, 'POINT')}">0</span></h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-white bg-danger shadow">
                <div class="card-body">
                    <h6>Total Expense</h6>
                    <h3>₹ <span th:text="${#numbers.formatDecimal(summary.totalExpense, 1, 'COMMA', 2, 'POINT')}">0</span></h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-white bg-primary shadow">
                <div class="card-body">
                    <h6>Balance</h6>
                    <h3>₹ <span th:text="${#numbers.formatDecimal(summary.balance, 1, 'COMMA', 2, 'POINT')}">0</span></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="mb-3">Expense by Category</h5>
                    <p th:if="${#lists.isEmpty(labels)}" class="text-muted mb-0">
                        No expenses this month
                    </p>
                    <canvas id="expenseChart" th:unless="${#lists.isEmpty(labels)}"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card shadow"
                 th:classappend="${savingsRate >= 20 ? 'border-success' : (savingsRate >= 0 ? 'border-warning' : 'border-danger')}">
                <div class="card-body">
                    <h6 class="text-muted">Savings Rate</h6>
                    <h2 th:text="${savingsRate} + '%'"
                        th:classappend="${savingsRate >= 20 ? 'text-success' : (savingsRate >= 0 ? 'text-warning' : 'text-danger')}">0%</h2>
                    <small class="text-muted"
                           th:text="'of income ' + ${savingsRate} + '% save'"></small>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h6 class="text-muted">Top Spending Category</h6>
                    <div th:if="${topCategory != null}">
                        <h2 th:text="${topCategory.category}">Food</h2>
                        <small class="text-muted">
                            ₹ <span th:text="${#numbers.formatDecimal(topCategory.total, 1, 'COMMA', 2, 'POINT')}"></span>
                            (
of total expenses <span th:text="${topPercent}"></span>%)
                        </small>
                    </div>
                    <p th:if="${topCategory == null}" class="text-muted mb-0">
                        No expenses this month
                    </p>
                </div>
            </div>
        </div>
    </div>

<script th:inline="javascript">
    const labels = /*[[${labels}]]*/ [];
    const values = /*[[${values}]]*/ [];

    if (labels.length > 0) {
        new Chart(document.getElementById('expenseChart'), {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{ data: values }]
            }
        });
    }
</script>
</body>
</html>
