<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FinTrack - Budgets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">FinTrack</span>
    <div class="d-flex">
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a th:href="@{/transactions}" class="btn btn-outline-light btn-sm me-2">Transactions</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Monthly Budgets</h4>
        <form th:action="@{/budgets}" method="get" class="m-0">
            <input type="month" name="month" th:value="${month}"
                   class="form-control" onchange="this.form.submit()">
        </form>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <h6 class="mb-3">Set Budget</h6>
            <form th:action="@{/budgets/set}" method="post" class="row g-2">
                <input type="hidden" name="month" th:value="${month}">
                <div class="col-md-5">
                    <select name="categoryId" class="form-select" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="number" step="0.01" min="1" name="monthlyLimit"
                           class="form-control" placeholder="Monthly limit (₹)" required>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">Save</button>
                </div>
            </form>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(statuses)}" class="text-muted">
        There is no budget this month.
    </p>

    <div class="card shadow-sm mb-3" th:each="s : ${statuses}">
        <div class="card-body">
            <div class="d-flex justify-content-between mb-2">
                <strong th:text="${s.category}">Food</strong>
                <span>₹ <span th:text="${s.spent}"></span> / ₹ <span th:text="${s.monthlyLimit}"></span></span>
            </div>

            <div class="progress mb-2" style="height: 22px;">
                <div class="progress-bar"
                     th:classappend="${s.exceeded ? 'bg-danger' : (s.percent >= 80 ? 'bg-warning' : 'bg-success')}"
                     th:style="|width: ${s.percent > 100 ? 100 : s.percent}%|"
                     th:text="${s.percent} + '%'">
                </div>
            </div>

            <small th:if="${s.exceeded}" class="text-danger"
                   th:text="'Limit cross! ₹' + ${s.remaining.negate()} + ' extra spent'"></small>
            <small th:unless="${s.exceeded}" class="text-muted"
                   th:text="'₹' + ${s.remaining} + ' is left'"></small>
        </div>
    </div>

</div>
</body>
</html>
